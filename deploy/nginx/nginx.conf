user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent $request_time "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  # 登录类接口额外限流（API 内部也有限流）
  limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;

  upstream api { server api:3000; keepalive 16; }

  server {
    listen 80;
    server_name _;
    # 微信"扫普通链接二维码打开小程序"校验文件与 Let's Encrypt 验证
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location ~ ^/[A-Za-z0-9]+\.txt$ { root /usr/share/nginx/verify; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API 只传 JSON，图片由小程序直传对象存储
    client_max_body_size 2m;

    location ~ ^/[A-Za-z0-9]+\.txt$ { root /usr/share/nginx/verify; }

    location /api/auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # 可选扩展（例如测试服务器用 MinIO 时挂载 minio-proxy.conf），生产默认为空
    include /etc/nginx/fabricqc.d/*.conf;

    # 布卷二维码链接：用普通扫码打开时提示使用小程序
    location /r/ { root /usr/share/nginx/html; try_files /qr-landing.html =404; }

    # PC 管理后台（SPA）
    location /assets/ { root /usr/share/nginx/html/admin; expires 30d; add_header Cache-Control "public, immutable"; }
    location / {
      root /usr/share/nginx/html/admin;
      try_files $uri /index.html;
      add_header Cache-Control "no-cache";
    }
  }
}
